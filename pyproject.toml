[project]
name = "heappe-management"
version = "0.1.0"
description = "Heappe Admin Panel - Django-based management application"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.15,<4.0",
    "gunicorn>=23.0,<24.0",
    "mssql-django>=1.6,<2.0",
    "mssql-python>=0.10.0,<0.11.0",
    "pymssql>=2.3,<3.0",
    "pyodbc>=5.2,<6.0",
    "pydantic>=2.11,<3.0",
    "pydantic-core>=2.33,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pytz>=2025.1",
    "requests>=2.32,<3.0",
    "urllib3>=2.5,<3.0",
    "paramiko>=4.0,<5.0",
    "scp>=0.15,<1.0",
    "docker>=7.1,<8.0",
    "gitpython>=3.1,<4.0",
    "typer>=0.20,<1.0",
    "rich>=14.1,<15.0",
    "azure-identity>=1.25,<2.0",
    "azure-core>=1.35,<2.0",
    "msal>=1.33,<2.0",
    "msal-extensions>=1.3,<2.0",
    "pyjwt>=2.10,<3.0",
    "cryptography>=45.0,<46.0",
    "bcrypt>=4.3,<5.0",
    "validators>=0.35,<1.0",
    "py4heappe>=2.5,<3.0",
    "salt>=3007,<3008",
    "invoke>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-django>=4.10,<5.0",
    "pytest-cov>=6.0,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Pin Python version for consistent environments
python-preference = "only-managed"

[tool.hatch.build.targets.wheel]
packages = ["adminpanel", "heappe_ui"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "adminpanel.settings"
python_files = ["tests.py", "test_*.py"]
addopts = "--cov=adminpanel --cov-report=term-missing"
