- name: Deploy Heappe AdminPanel (No Nginx)
  hosts: all
  become: true
  vars_prompt:
    - name: git_user
      prompt: "Enter your GIT username (leave empty for public repo)"
      private: false

    - name: git_pass
      prompt: "Enter your GIT password/token"
      private: true

  vars:
    # --- APPLICATION CONFIGURATION ---
    app_dir: "/opt/heappe/heappe-admin-app"
    app_port: 8000
    app_bind: "0.0.0.0:{{ app_port }}"
    service_file: "/etc/systemd/system/adminpanel.service"

    # --- GIT CONFIGURATION ---
    git_repo: "opencode.it4i.eu/heappe-middleware/heappe-management.git"
    git_branch: "main"

    # --- PYTHON CONFIGURATION ---
    build_dir: "{{ app_dir }}/build"
    python_version_major: 3
    python_version_minor: 12
    python_version_patch: 12
    python_exe: "python{{ python_version_major }}.{{ python_version_minor }}"
    python_version: "{{ python_version_major }}.{{ python_version_minor }}.{{ python_version_patch }}"
    python_src_dir: "{{ build_dir }}/python"
    python_prefix: "{{ app_dir }}/python"
    venv_dir: "{{ app_dir }}/branches/.venv-{{ git_branch }}"

  tasks:
    # -------------------------------------------------------------------------
    # 1. PREREQUISITES & DOCKER
    # -------------------------------------------------------------------------
    - name: Install required base packages for building Python (Ubuntu / Debian)
      ansible.builtin.apt:
        name:
          - wget
          - curl
          - build-essential
          - xz-utils
          - tk-dev
          - zlib1g-dev
          - libncurses-dev
          - libgdbm-dev
          - libnss3-dev
          - libssl-dev
          - libreadline-dev
          - libffi-dev
          - libbz2-dev
          - libsqlite3-dev
          - liblzma-dev
          - libc6-dev
        state: present
      when: ansible_os_family == 'Debian'

    - name: Install required base packages for building Python (CentOS / RHEL)
      ansible.builtin.dnf:
        name:
          - git
          - gcc
          - make
          - bzip2
          - bzip2-devel
          - xz-devel
          - zlib-devel
          - libffi-devel
          - wget
          - curl
          - unixODBC
          - yum-utils
          - dnf-plugins-core
          - openssl-devel
          - readline-devel
          - sqlite-devel
        state: present
      when: ansible_os_family == 'RedHat'

    - name: Install required base packages (Ubuntu / Debian)
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg-agent
          - libodbc2
        state: present
      when: ansible_os_family == 'Debian'

    - name: Add Docker repository (Ubuntu / Debian)
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: "https://download.docker.com/linux/{{ ansible_distribution | lower }}"
        signed_by: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        suites: ["{{ ansible_distribution_release | lower }}"]
        components: [stable]
        state: present
        enabled: true
      when: ansible_os_family == 'Debian'

    - name: Add Docker repository (CentOS / RHEL)
      ansible.builtin.yum_repository:
        name: docker-ce
        description: Docker CE Stable repo
        baseurl: https://download.docker.com/linux/centos/$releasever/$basearch/stable
        enabled: true
        gpgcheck: true
        gpgkey: https://download.docker.com/linux/centos/gpg
      when: ansible_os_family == 'RedHat'

    - name: Install Docker (CentOS / RHEL)
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
      when: ansible_os_family == 'RedHat'

    - name: Install Docker (Ubuntu / Debian)
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: true
      when: ansible_os_family == 'Debian'

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    # -------------------------------------------------------------------------
    # 2. GIT & APPLICATION STRUCTURE
    # -------------------------------------------------------------------------
    - name: Ensure application directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}/branches/{{ git_branch }}"
        state: directory
        mode: '0755'

    - name: Clone or update repository
      ansible.builtin.git:
        repo: "https://{{ git_user }}:{{ git_pass }}@{{ git_repo }}"
        dest: "{{ app_dir }}/branches/{{ git_branch }}"
        update: true
        force: true
        version: "{{ git_branch }}"

    - name: Configure Git safe directory
      community.general.git_config:
        scope: global
        name: safe.directory
        value: "{{ app_dir }}/branches/{{ git_branch }}"

    # -------------------------------------------------------------------------
    # 3. PYTHON COMPILATION
    # -------------------------------------------------------------------------
    - name: Create Python source directory
      ansible.builtin.file:
        path: "{{ python_src_dir }}"
        state: directory
        mode: '0755'

    - name: Download Python source
      ansible.builtin.get_url:
        url: "https://www.python.org/ftp/python/{{ python_version }}/Python-{{ python_version }}.tgz"
        dest: "{{ python_src_dir }}/Python-{{ python_version }}.tgz"
        mode: '0644'

    - name: Extract Python source
      ansible.builtin.unarchive:
        src: "{{ python_src_dir }}/Python-{{ python_version }}.tgz"
        dest: "{{ python_src_dir }}"
        remote_src: true

    - name: Delete extracted .tgz file
      ansible.builtin.shell: |
        rm -f {{ python_src_dir }}/Python-{{ python_version }}.tgz
      changed_when: true

    - name: Create Python installation directory (prefix)
      ansible.builtin.file:
        path: "{{ python_prefix }}"
        state: directory
        mode: '0755'

    - name: Compile and install Python from source
      ansible.builtin.shell: |
        cd {{ python_src_dir }}/Python-{{ python_version }}
        ./configure --enable-optimizations --with-ensurepip=install --prefix={{ python_prefix }}
        make -j $(nproc)
        make altinstall
      args:
        creates: "{{ python_prefix }}/bin/{{ python_exe }}"

    - name: Some cleanup
      ansible.builtin.shell: |
        rm -rf {{ python_src_dir }}/Python-{{ python_version }}
        test -n "$(ls -A "{{ python_src_dir }}")" || rmdir "{{ python_src_dir }}"
        test -n "$(ls -A "{{ build_dir }}")" || rmdir "{{ build_dir }}"
      changed_when: true

    # -------------------------------------------------------------------------
    # 4. SERVICE SETUP & DEPLOY
    # -------------------------------------------------------------------------
    - name: Create systemd service
      ansible.builtin.copy:
        dest: "{{ service_file }}"
# yamllint disable
        content: |
          [Unit]
          Description=Gunicorn instance for Heappe AdminPanel
          After=network.target

          [Service]
          User=root
          Group=root
          WorkingDirectory={{ app_dir }}/branches/{{ git_branch }}
          # Create venv if missing
          ExecStartPre=/bin/bash -c '[[ -d {{ venv_dir }} ]] || {{ python_prefix }}/bin/{{ python_exe }} -m venv {{ venv_dir }}'
          # Install dependencies
          ExecStartPre={{ venv_dir }}/bin/pip install --upgrade pip
          ExecStartPre={{ venv_dir }}/bin/pip install -r {{ app_dir }}/branches/{{ git_branch }}/requirements.txt
          # Run migrations
          ExecStartPre={{ venv_dir }}/bin/python {{ app_dir }}/branches/{{ git_branch }}/manage.py migrate
          # Ensure admin user exists
          ExecStartPre={{ venv_dir }}/bin/python {{ app_dir }}/branches/{{ git_branch }}/manage.py shell -c "from django.contrib.auth import get_user_model; User=get_user_model(); User.objects.filter(username='admin').exists() or User.objects.create_superuser('admin', 'admin@example.com', 'admin')"
          
          Environment="PYTHONUNBUFFERED=1"
          Environment="MANAGEMENT_PROXYPASS=false"
          
          # Start Gunicorn directly on app_port (8000)
          ExecStart={{ venv_dir }}/bin/gunicorn adminpanel.wsgi:application --workers 1 --bind {{ app_bind }} --timeout 360
          
          StandardOutput=journal
          StandardError=journal
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
# yamllint enable
        mode: '0644'

    - name: Remove old virtual environment if exists
      ansible.builtin.file:
        path: "{{ venv_dir }}"
        state: absent

    - name: Enable and restart adminpanel service
      ansible.builtin.systemd:
        name: adminpanel
        enabled: true
        daemon_reload: true
        state: restarted

    # Optional: Open port 8000 in firewall if firewalld is present (since Nginx reverse proxy is gone)
    - name: Allow App Port (8000) in firewall (if firewalld is running)
      ansible.posix.firewalld:
        port: "{{ app_port }}/tcp"
        permanent: true
        state: enabled
        immediate: true
      when: ansible_facts.services['firewalld.service'] is defined
      ignore_errors: true
