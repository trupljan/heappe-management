- name: Deploy Heappe AdminPanel (No Nginx)
  hosts: all
  become: true
  vars_prompt:
    - name: git_user
      prompt: "Enter your GIT username (leave empty for public repo)"
      private: false

    - name: git_pass
      prompt: "Enter your GIT password/token"
      private: true

  vars:
    # --- APPLICATION CONFIGURATION ---
    service_name: "adminpanel"
    app_dir: "/opt/heappe/heappe-admin-app"
    app_port: 8000
    app_bind: "0.0.0.0:{{ app_port }}"
    service_file: "/etc/systemd/system/{{ service_name }}.service"

    # --- GIT CONFIGURATION ---
    git_repo: "opencode.it4i.eu/heappe-middleware/heappe-management.git"
    git_branch: "main"

    # --- PYTHON CONFIGURATION ---
    python_exe: "python3.12"
    python_bin_path: "/usr/bin/{{ python_exe }}"
    venv_dir: "{{ app_dir }}/branches/.venv-{{ git_branch }}"

  tasks:
    # -------------------------------------------------------------------------
    # 1. PREREQUISITES & DOCKER
    # -------------------------------------------------------------------------
    - name: Install Python and required base packages (Ubuntu / Debian)
      ansible.builtin.apt:
        name:
          - "{{ python_exe }}"
          - "{{ python_exe }}-venv"
          - python3-pip
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg-agent
          - libodbc2
        state: present
        update_cache: true
      when: ansible_os_family == 'Debian'

    - name: Install base packages (CentOS / RHEL)
      ansible.builtin.dnf:
        name:
          - git
          - wget
          - curl
          - unixODBC
          - dnf-plugins-core
        state: present
      when: ansible_os_family == 'RedHat'

    - name: Install Python packages (CentOS / RHEL)
      ansible.builtin.dnf:
        name:
          - "{{ python_exe }}"
          - "{{ python_exe }}-devel"
          - "{{ python_exe }}-pip"
        state: present
      when:
        - ansible_os_family == 'RedHat'
        - python_exe != 'python3'

    - name: Install default Python packages if python_exe is python3 (CentOS / RHEL)
      ansible.builtin.dnf:
        name:
          - python3
          - python3-devel
          - python3-pip
        state: present
      when:
        - ansible_os_family == 'RedHat'
        - python_exe == 'python3'

    - name: Add Docker repository (Ubuntu / Debian)
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: "https://download.docker.com/linux/{{ ansible_distribution | lower }}"
        signed_by: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        suites: ["{{ ansible_distribution_release | lower }}"]
        components: [stable]
        state: present
        enabled: true
      when: ansible_os_family == 'Debian'

    - name: Add Docker repository (CentOS / RHEL)
      ansible.builtin.yum_repository:
        name: docker-ce
        description: Docker CE Stable repo
        baseurl: https://download.docker.com/linux/centos/$releasever/$basearch/stable
        enabled: true
        gpgcheck: true
        gpgkey: https://download.docker.com/linux/centos/gpg
      when: ansible_os_family == 'RedHat'

    - name: Install Docker (CentOS / RHEL)
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
      when: ansible_os_family == 'RedHat'

    - name: Install Docker (Ubuntu / Debian)
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: true
      when: ansible_os_family == 'Debian'

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    # -------------------------------------------------------------------------
    # 2. GIT & APPLICATION STRUCTURE
    # -------------------------------------------------------------------------
    - name: Ensure application directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}/branches/{{ git_branch }}"
        state: directory
        mode: '0755'

    - name: Clone or update repository
      ansible.builtin.git:
        repo: "https://{{ git_user }}:{{ git_pass }}@{{ git_repo }}"
        dest: "{{ app_dir }}/branches/{{ git_branch }}"
        update: true
        force: true
        version: "{{ git_branch }}"

    - name: Configure Git safe directory
      community.general.git_config:
        scope: global
        name: safe.directory
        value: "{{ app_dir }}/branches/{{ git_branch }}"

    # -------------------------------------------------------------------------
    # 3. SERVICE SETUP & DEPLOY
    # -------------------------------------------------------------------------
    - name: Create systemd service
      ansible.builtin.copy:
        dest: "{{ service_file }}"
# yamllint disable
        content: |
          [Unit]
          Description=Gunicorn instance for Heappe AdminPanel
          After=network.target

          [Service]
          User=root
          Group=root
          WorkingDirectory={{ app_dir }}/branches/{{ git_branch }}
          # Create venv if missing
          ExecStartPre=/bin/bash -c '[[ -d {{ venv_dir }} ]] || {{ python_bin_path }} -m venv {{ venv_dir }}'
          # Install dependencies
          ExecStartPre={{ venv_dir }}/bin/pip install --upgrade pip
          ExecStartPre={{ venv_dir }}/bin/pip install -r {{ app_dir }}/branches/{{ git_branch }}/requirements.txt
          # Run migrations
          ExecStartPre={{ venv_dir }}/bin/python {{ app_dir }}/branches/{{ git_branch }}/manage.py migrate
          # Ensure admin user exists
          ExecStartPre={{ venv_dir }}/bin/python {{ app_dir }}/branches/{{ git_branch }}/manage.py shell -c "from django.contrib.auth import get_user_model; User=get_user_model(); User.objects.filter(username='admin').exists() or User.objects.create_superuser('admin', 'admin@example.com', 'admin')"
          
          Environment="PYTHONUNBUFFERED=1"
          Environment="MANAGEMENT_PROXYPASS=false"
          
          # Start Gunicorn directly on app_port (8000)
          ExecStart={{ venv_dir }}/bin/gunicorn adminpanel.wsgi:application --workers 1 --bind {{ app_bind }} --timeout 360
          
          StandardOutput=journal
          StandardError=journal
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
# yamllint enable
        mode: '0644'

    - name: Remove old virtual environment if exists
      ansible.builtin.file:
        path: "{{ venv_dir }}"
        state: absent

    - name: Enable and restart adminpanel service
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        enabled: true
        daemon_reload: true
        state: restarted

    # Optional: Open port 8000 in firewall if firewalld is present (since Nginx reverse proxy is gone)
    - name: Allow App Port (8000) in firewall (if firewalld is running)
      ansible.posix.firewalld:
        port: "{{ app_port }}/tcp"
        permanent: true
        state: enabled
        immediate: true
      when: ansible_facts.services['firewalld.service'] is defined
      ignore_errors: true
