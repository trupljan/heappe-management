# How to run:
# ansible-playbook -i inventory.ini --user <your_user> --ask-pass --ask-become-pass playbook_deploy_heappemanagement.yml

- name: Deploy Heappe AdminPanel
  hosts: all
  become: true
  vars_prompt:
    - name: git_user
      prompt: "Enter your GIT username (leave empty for public repo)"
      private: false

    - name: git_pass
      prompt: "Enter your GIT password/token"
      private: true

  vars:
    # --- APPLICATION CONFIGURATION ---
    service_name: "adminpanel"
    app_dir: "/opt/heappe/heappe-admin-app"
    app_port: 8000
    app_bind: "0.0.0.0:{{ app_port }}"
    app_nginx_proxypass: "http://127.0.0.1:{{ app_port }}/"
    service_file: "/etc/systemd/system/{{ service_name }}.service"

    # --- GIT CONFIGURATION ---
    git_repo: "opencode.it4i.eu/heappe-middleware/heappe-management.git"
    git_branch: "main"

    # --- NGINX CONFIGURATION (PLEASE FILL AS NEEDED) ---
    # Quick Reference:
    # ---------------------------------------------------------------------------------------------
    # Variable                  | Description                       | Example Value
    # --------------------------|-----------------------------------|------------------------------
    # nginx_server_name         | Server address or FQDN            | server_name heappe.com;
    # nginx_listen              | Port and protocol                 | listen 80; or listen 443 ssl;
    # nginx_ssl_certificate     | Path to SSL certificate (.pem)    | ssl_certificate /etc/ssl/certs/cert.pem;
    # nginx_ssl_certificate_key | Path to private SSL key (.key)    | ssl_certificate_key /etc/ssl/private/key.key;
    # ---------------------------------------------------------------------------------------------

    nginx_server_name: "server_name <address-or-FQDN>;" # <-- FILL IN DOMAIN OR IP HERE
    
    # Select one of the options below (uncomment as needed):
    nginx_listen: "listen 80;" 
    # nginx_listen: "listen 443 ssl http2;"

    # If using SSL (port 443), specify the file paths:
    nginx_ssl_certificate: "ssl_certificate <ssl-cert-path>;"
    nginx_ssl_certificate_key: "ssl_certificate_key <ssl-key-path>;"

# Setup HEAppE API endpoint
    heappe_nginx_location: "/api/"
    heappe_nginx_proxypass: "http://127.0.0.1:5000/"

# Setup HEAppE datastaging endpoint
    heappe_datastaging_nginx_location: "/datastaging/"
    heappe_datastaging_nginx_proxypass: "http://127.0.0.1:5001/"

# Setup python options
    python_exe: "python3.12"
    python_bin_path: "/usr/bin/{{ python_exe }}"
    venv_dir: "{{ app_dir }}/branches/.venv-{{ git_branch }}"

  tasks:
    - name: Install Python and required base packages (Ubuntu / Debian)
      ansible.builtin.apt:
        name:
          - "{{ python_exe }}"
          - "{{ python_exe }}-venv"
          - python3-pip
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg-agent
          - libodbc2
        state: present
        update_cache: true
      when: ansible_os_family == 'Debian'

    - name: Install base packages (CentOS / RHEL)
      ansible.builtin.dnf:
        name:
          - git
          - wget
          - curl
          - unixODBC
          - dnf-plugins-core
        state: present
      when: ansible_os_family == 'RedHat'

    - name: Install Python packages (CentOS / RHEL)
      ansible.builtin.dnf:
        name:
          - "{{ python_exe }}"
          - "{{ python_exe }}-devel"
          - "{{ python_exe }}-pip"
        state: present
      when:
        - ansible_os_family == 'RedHat'
        - python_exe != 'python3'

    - name: Install default Python packages if python_exe is python3 (CentOS / RHEL)
      ansible.builtin.dnf:
        name:
          - python3
          - python3-devel
          - python3-pip
        state: present
      when:
        - ansible_os_family == 'RedHat'
        - python_exe == 'python3'

    - name: Add Docker repository (Ubuntu / Debian)
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: "https://download.docker.com/linux/{{ ansible_distribution | lower }}"
        signed_by: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        suites: ["{{ ansible_distribution_release | lower }}"]
        components: [stable]
        state: present
        enabled: true
      when: ansible_os_family == 'Debian'

    - name: Add Docker repository (CentOS / RHEL)
      ansible.builtin.yum_repository:
        name: docker-ce
        description: Docker CE Stable repo
        baseurl: https://download.docker.com/linux/centos/$releasever/$basearch/stable
        enabled: true
        gpgcheck: true
        gpgkey: https://download.docker.com/linux/centos/gpg
      when: ansible_os_family == 'RedHat'

    - name: Install Docker (CentOS / RHEL)
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
      when: ansible_os_family == 'RedHat'

    - name: Install Docker (Ubuntu / Debian)
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: true
      when: ansible_os_family == 'Debian'

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Ensure application directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}/branches/{{ git_branch }}"
        state: directory
        mode: '0755'

    - name: Clone or update repository
      ansible.builtin.git:
        repo: "https://{{ git_user }}:{{ git_pass }}@{{ git_repo }}"
        dest: "{{ app_dir }}/branches/{{ git_branch }}"
        update: true
        force: true
        version: "{{ git_branch }}"

    - name: Configure Git safe directory
      community.general.git_config:
        scope: global
        name: safe.directory
        value: "{{ app_dir }}/branches/{{ git_branch }}"

    - name: Create systemd service
      ansible.builtin.copy:
        dest: "{{ service_file }}"
# yamllint disable
        content: |
          [Unit]
          Description=Gunicorn instance for Heappe AdminPanel
          After=network.target

          [Service]
          User=root
          Group=root
          WorkingDirectory={{ app_dir }}/branches/{{ git_branch }}
          ExecStartPre=/bin/bash -c '[[ -d {{ venv_dir }} ]] || {{ python_bin_path }} -m venv {{ venv_dir }}'
          ExecStartPre={{ venv_dir }}/bin/pip install --upgrade pip
          ExecStartPre={{ venv_dir }}/bin/pip install -r {{ app_dir }}/branches/{{ git_branch }}/requirements.txt
          ExecStartPre={{ venv_dir }}/bin/python {{ app_dir }}/branches/{{ git_branch }}/manage.py migrate
          ExecStartPre={{ venv_dir }}/bin/python {{ app_dir }}/branches/{{ git_branch }}/manage.py shell -c "from django.contrib.auth import get_user_model; User=get_user_model(); User.objects.filter(username='admin').exists() or User.objects.create_superuser('admin', 'admin@example.com', 'admin')"
          Environment="PYTHONUNBUFFERED=1"
          Environment="MANAGEMENT_PROXYPASS=true"
          ExecStart={{ venv_dir }}/bin/gunicorn adminpanel.wsgi:application --workers 1 --bind {{ app_bind }} --timeout 360
          StandardOutput=journal
          StandardError=journal
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
# yamllint enable
        mode: '0644'

    - name: Remove old virtual environment if exists
      ansible.builtin.file:
        path: "{{ venv_dir }}"
        state: absent

    - name: Enable and restart adminpanel service
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        enabled: true
        daemon_reload: true
        state: restarted

    - name: Install nginx (Ubuntu / Debian)
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
      when: ansible_os_family == 'Debian'

    - name: Delete link to default nginx site that hijacks location handling (Ubuntu / Debian)
      ansible.builtin.file:
        state: absent
        path: /etc/nginx/sites-enabled/default
      when: ansible_os_family == 'Debian'

    - name: Install nginx (CentOS / RHEL)
      ansible.builtin.dnf:
        name: nginx
        state: present
        update_cache: true
      when: ansible_os_family == 'RedHat'

    - name: Start and enable Nginx service
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Allow HTTP service in firewall (if firewalld is running)
      ansible.posix.firewalld:
        service: http
        permanent: true
        state: enabled
        immediate: true
      when: ansible_facts.services['firewalld.service'] is defined

    - name: Make sure http and https are enabled for nginx
      ansible.builtin.shell: |
        if command -v firewall-cmd >/dev/null 2>&1
        then
            firewall-cmd --permanent --zone=public --add-service=http
            firewall-cmd --permanent --zone=public --add-service=https
        fi
        echo "OK"
      changed_when: false

    - name: Set httpd_can_network_connect flag on and keep it persistent across reboots
      ansible.posix.seboolean:
        name: httpd_can_network_connect
        state: true
        persistent: true
      when: ansible_selinux is defined and ansible_selinux and ansible_selinux.status == 'enabled'
      ignore_errors: true

    - name: Deploy application's nginx config for heappe management
      ansible.builtin.copy:
        dest: "/etc/nginx/conf.d/{{ service_name }}.conf"
        owner: root
        group: root
        force: true
        mode: '0644'
# yamllint disable
        content: |

          log_format api_enhanced '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        'rt=$request_time uct="$upstream_connect_time" uat="$upstream_header_time" urt="$upstream_response_time" '
                        'host="$host" proto=$scheme '
                        'API-Key: "$http_x_api_key" '
                        'Auth: "$http_authorization" '
                        'Ref: "$http_referer" UA: "$http_user_agent" '
                        'ReqID: "$request_id"';

          server {
              {{ nginx_server_name }}
              {{ nginx_listen }}
              {{ nginx_ssl_certificate }}
              {{ nginx_ssl_certificate_key }}

              client_max_body_size 50M;

              location /management/static/ {
                  alias {{ app_dir }}/branches/{{ git_branch }}/heappe_ui/static/;
                  expires 30d;
                  access_log off;
                  add_header Cache-Control "public, max-age=2592000";
                  access_log /var/log/nginx/{{ service_name }}-access.log;
                  error_log /var/log/nginx/{{ service_name }}-error.log;
              }

              location /management/static/admin/ {
                  alias {{ venv_dir }}/lib/{{ python_exe }}/site-packages/django/contrib/admin/static/admin/;
                  expires 30d;
                  access_log off;
                  add_header Cache-Control "public, max-age=2592000";
                  access_log /var/log/nginx/{{ service_name }}-access.log;
                  error_log /var/log/nginx/{{ service_name }}-error.log;
              }

              location /management/ {
                  proxy_pass {{ app_nginx_proxypass }};
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  access_log /var/log/nginx/{{ service_name }}-access.log;
                  error_log /var/log/nginx/{{ service_name }}-error.log;
              }

              {%if heappe_nginx_location and heappe_nginx_proxypass %}
              location {{ heappe_nginx_location }} {
                  proxy_pass {{ heappe_nginx_proxypass }};
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  proxy_request_buffering off;
                  proxy_http_version 1.1;
                  client_max_body_size 3G;
                  proxy_connect_timeout 3600s;
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
                  client_body_timeout 3600s;
                  
                  access_log /var/log/nginx/heappe-api-access.log api_enhanced;
                  error_log /var/log/nginx/heappe-api-error.log;
              }
              {% endif %}

              {% if heappe_datastaging_nginx_location and heappe_datastaging_nginx_proxypass %}
              location {{ heappe_datastaging_nginx_location }} {
                  proxy_pass {{ heappe_datastaging_nginx_proxypass }};
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  proxy_request_buffering off;
                  proxy_http_version 1.1;
                  client_max_body_size 3G;
                  proxy_connect_timeout 3600s;
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
                  client_body_timeout 3600s;

                  access_log /var/log/nginx/heappe-api-access.log api_enhanced;
                  error_log /var/log/nginx/heappe-api-error.log;
                }
              {% endif %}

              include conf.d/{{ service_name }}-*.inc;
          }
# yamllint enable
      notify: validate_and_reload_nginx


  handlers:

    - name: Validate and reload nginx
      block:
        - name: Test nginx configuration
          ansible.builtin.command: |
            nginx -t
          changed_when: false
          listen: validate_and_reload_nginx

        - name: Reload nginx
          ansible.builtin.systemd:
            name: nginx
            state: reloaded
          changed_when: true
          listen: validate_and_reload_nginx

    - name: Restart Nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
      listen: reload_nginx


