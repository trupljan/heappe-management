- name: Deploy Heappe AdminPanel (No Nginx)
  hosts: all
  become: true
  vars_prompt:
    - name: git_user
      prompt: "Enter your GIT username (leave empty for public repo)"
      private: false

    - name: git_pass
      prompt: "Enter your GIT password/token"
      private: true

  vars:
    ansible_python_interpreter: "/usr/bin/python3"

    # --- APPLICATION CONFIGURATION ---
    service_name: "adminpanel"
    app_dir: "/opt/heappe/heappe-admin-app"
    app_port: 8000
    app_bind: "0.0.0.0:{{ app_port }}"
    service_file: "/etc/systemd/system/{{ service_name }}.service"

    # --- GIT CONFIGURATION ---
    git_repo: "opencode.it4i.eu/heappe-middleware/heappe-management.git"
    git_branch: "main"

    # --- PYTHON CONFIGURATION ---
    python_exe: "{{ 'python3' if ansible_os_family == 'Debian' else 'python3.12' }}"
    python_bin_path: "/usr/bin/{{ python_exe }}"
    venv_dir: "{{ app_dir }}/branches/.venv-{{ git_branch }}"

  tasks:
    # -------------------------------------------------------------------------
    # 1. PREREQUISITES & DOCKER
    # -------------------------------------------------------------------------
    - name: Install Python and required base packages (Ubuntu / Debian)
      ansible.builtin.apt:
        name:
          - "{{ python_exe }}"
          - "{{ python_exe }}-venv"
          - python3-pip
          - python3-debian
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg-agent
          - libodbc2
          - build-essential
          - libffi-dev
          - python3-dev
          - libssl-dev
          - unixodbc-dev
        state: present
        update_cache: true
      when: ansible_os_family == 'Debian'

    - name: Install base packages (CentOS / RHEL)
      ansible.builtin.dnf:
        name:
          - git
          - wget
          - curl
          - unixODBC
          - dnf-plugins-core
        state: present
      when: ansible_os_family == 'RedHat'

    - name: Install Python packages (CentOS / RHEL)
      ansible.builtin.dnf:
        name:
          - "{{ python_exe }}"
          - "{{ python_exe }}-devel"
          - "{{ python_exe }}-pip"
        state: present
      when:
        - ansible_os_family == 'RedHat'
        - python_exe != 'python3'

    - name: Install default Python packages if python_exe is python3 (CentOS / RHEL)
      ansible.builtin.dnf:
        name:
          - python3
          - python3-devel
          - python3-pip
        state: present
      when:
        - ansible_os_family == 'RedHat'
        - python_exe == 'python3'

    - name: Create directory for apt keyrings (Ubuntu / Debian)
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      when: ansible_os_family == 'Debian'

    - name: Download Docker GPG key (Ubuntu / Debian)
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
      when: ansible_os_family == 'Debian'

    - name: Add Docker repository (Ubuntu / Debian)
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release | lower }} stable"
        state: present
      when: ansible_os_family == 'Debian'

    - name: Add Docker repository (CentOS / RHEL)
      ansible.builtin.yum_repository:
        name: docker-ce
        description: Docker CE Stable repo
        baseurl: https://download.docker.com/linux/centos/$releasever/$basearch/stable
        enabled: true
        gpgcheck: true
        gpgkey: https://download.docker.com/linux/centos/gpg
      when: ansible_os_family == 'RedHat'

    - name: Install Docker (CentOS / RHEL)
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
      when: ansible_os_family == 'RedHat'

    - name: Install Docker (Ubuntu / Debian)
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: true
      when: ansible_os_family == 'Debian'

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    # -------------------------------------------------------------------------
    # 2. GIT & APPLICATION STRUCTURE
    # -------------------------------------------------------------------------
    - name: Ensure application directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}/branches/{{ git_branch }}"
        state: directory
        mode: '0755'

    - name: Clone or update repository
      ansible.builtin.git:
        repo: "https://{{ git_user }}:{{ git_pass }}@{{ git_repo }}"
        dest: "{{ app_dir }}/branches/{{ git_branch }}"
        update: true
        force: true
        version: "{{ git_branch }}"

    - name: Configure Git safe directory
      community.general.git_config:
        scope: global
        name: safe.directory
        value: "{{ app_dir }}/branches/{{ git_branch }}"

    # -------------------------------------------------------------------------
    # 3. SERVICE SETUP & DEPLOY
    # -------------------------------------------------------------------------
    - name: Remove old virtual environment if exists
      ansible.builtin.file:
        path: "{{ venv_dir }}"
        state: absent

    - name: Create virtual environment
      ansible.builtin.command: "{{ python_bin_path }} -m venv {{ venv_dir }}"
      args:
        creates: "{{ venv_dir }}/bin/activate"

    - name: Upgrade pip in virtual environment
      ansible.builtin.command: "{{ venv_dir }}/bin/pip install --upgrade pip"
      changed_when: true

    - name: Install requirements in virtual environment
      ansible.builtin.command: "{{ venv_dir }}/bin/pip install -r {{ app_dir }}/branches/{{ git_branch }}/requirements.txt"
      environment:
        PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      changed_when: true

    - name: Run Django database migrations
      ansible.builtin.command: "{{ venv_dir }}/bin/python {{ app_dir }}/branches/{{ git_branch }}/manage.py migrate"
      changed_when: true

    - name: Ensure admin superuser exists
      ansible.builtin.command: >
        {{ venv_dir }}/bin/python {{ app_dir }}/branches/{{ git_branch }}/manage.py shell -c
        "from django.contrib.auth import get_user_model; User=get_user_model(); User.objects.filter(username='admin').exists() or User.objects.create_superuser('admin', 'admin@example.com', 'admin')"
      changed_when: false

    - name: Create systemd service
      ansible.builtin.copy:
        dest: "{{ service_file }}"
# yamllint disable
        content: |
          [Unit]
          Description=Gunicorn instance for Heappe AdminPanel
          After=network.target

          [Service]
          User=root
          Group=root
          WorkingDirectory={{ app_dir }}/branches/{{ git_branch }}
          
          Environment="PYTHONUNBUFFERED=1"
          Environment="MANAGEMENT_PROXYPASS=true"
          
          # Start Gunicorn directly on app_port (8000)
          ExecStart={{ venv_dir }}/bin/gunicorn adminpanel.wsgi:application --workers 1 --bind {{ app_bind }} --timeout 360
          
          StandardOutput=journal
          StandardError=journal
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
# yamllint enable
        mode: '0644'

    - name: Enable and restart adminpanel service
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        enabled: true
        daemon_reload: true
        state: restarted

    # Optional: Open port 8000 in firewall if firewalld is present (since Nginx reverse proxy is gone)
    - name: Allow App Port (8000) in firewall (if firewalld is running)
      ansible.posix.firewalld:
        port: "{{ app_port }}/tcp"
        permanent: true
        state: enabled
        immediate: true
      when: ansible_facts.services['firewalld.service'] is defined
      ignore_errors: true