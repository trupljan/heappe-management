{% extends "base.html" %}

{% block title %}Server Error (500){% endblock %}

{% block content %}
<div class="container py-5 animate-fade-in">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card text-center">
                <div class="card-body" style="padding:3rem 2rem;">
                    <div style="font-size:7rem;font-weight:800;font-family:var(--font-heading);line-height:1;background:linear-gradient(135deg,var(--accent-rose),#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:1rem;">
                        500
                    </div>
                    <div style="width:60px;height:3px;background:linear-gradient(90deg,var(--accent-rose),#f97316);margin:0 auto 1.5rem;border-radius:2px;"></div>
                    <h4 class="mb-2">Internal Server Error</h4>
                    <p class="text-muted mb-4" style="font-size:0.9rem;">Something went wrong on our server. You can try reloading or switching HEAppE instances if the active instance is causing problems.</p>

                    <div class="d-flex gap-2 justify-content-center">
                        <button onclick="window.location.reload();" class="btn btn-primary">
                            <i class="bi bi-arrow-clockwise me-1"></i>Try Again
                        </button>
                        <a href="{% url 'dashboard_view' %}" class="btn btn-outline-secondary">
                            <i class="bi bi-house-door me-1"></i>Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
