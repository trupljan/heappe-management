{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 shadow-sm">
                <h4 class="mb-4">Choose Instance</h4>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="instance_id" class="form-label">Select Instance</label>
                        <select class="form-select" id="instance_id" name="InstanceName" required>
                            <option value="">-- Choose an instance --</option>
                            {% for inst in instances %}
                                <option value="{{ inst.instance_name }}">
                                    {{ inst.instance_name }} ({{ inst.heappe_host }})
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
