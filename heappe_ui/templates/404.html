{% extends "base.html" %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="container py-5 animate-fade-in">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card text-center">
                <div class="card-body" style="padding:3rem 2rem;">
                    <div style="font-size:7rem;font-weight:800;font-family:var(--font-heading);line-height:1;background:linear-gradient(135deg,var(--accent-blue),var(--accent-cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:1rem;">
                        404
                    </div>
                    <div style="width:60px;height:3px;background:linear-gradient(90deg,var(--accent-blue),var(--accent-cyan));margin:0 auto 1.5rem;border-radius:2px;"></div>
                    <h4 class="mb-2">Page Not Found</h4>
                    <p class="text-muted mb-1" style="font-size:0.9rem;">The page you are looking for doesn't exist or has been moved.</p>
                    {% if request_path %}
                        <p class="text-muted mb-4" style="font-size:0.8rem;">
                            Path: <code style="color:var(--accent-cyan);font-size:0.78rem;">{{ request_path }}</code>
                        </p>
                    {% else %}
                        <div class="mb-4"></div>
                    {% endif %}

                    <div class="d-flex gap-2 justify-content-center">
                        <button onclick="window.history.back();" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i>Go Back
                        </button>
                        <a href="{% url 'dashboard_view' %}" class="btn btn-primary">
                            <i class="bi bi-house-door me-1"></i>Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
