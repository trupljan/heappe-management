    <!-- Top Row: Metrics (Clickable Navigation Cards) -->
    <div class="row g-3 mb-4">
        <!-- Clusters -->
        <div class="col-6 col-lg">
            <a href="{% url 'cluster_list' %}" class="card border-0 shadow-sm text-decoration-none h-100 transition-hover bg-white">
                <div class="card-body p-3 d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-primary bg-opacity-10 text-primary rounded p-2.5 d-inline-flex">
                            <i class="bi bi-server fs-5"></i>
                        </div>
                        <div>
                            <span class="text-muted small d-block fw-semibold text-uppercase tracking-wider" style="font-size: 0.7rem;">Clusters</span>
                            <h4 class="mb-0 fw-bold text-dark mt-0.5">{{ clusters|length|default:"0" }}</h4>
                        </div>
                    </div>
                    <i class="bi bi-chevron-right text-muted small"></i>
                </div>
            </a>
        </div>
        <!-- Projects -->
        <div class="col-6 col-lg">
            <a href="{% url 'project_list' %}" class="card border-0 shadow-sm text-decoration-none h-100 transition-hover bg-white">
                <div class="card-body p-3 d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-success bg-opacity-10 text-success rounded p-2.5 d-inline-flex">
                            <i class="bi bi-folder fs-5"></i>
                        </div>
                        <div>
                            <span class="text-muted small d-block fw-semibold text-uppercase tracking-wider" style="font-size: 0.7rem;">Projects</span>
                            <h4 class="mb-0 fw-bold text-dark mt-0.5">{{ projects|length|default:"0" }}</h4>
                        </div>
                    </div>
                    <i class="bi bi-chevron-right text-muted small"></i>
                </div>
            </a>
        </div>
        <!-- Queues -->
        <div class="col-6 col-lg">
            <a href="{% url 'queues_view' %}" class="card border-0 shadow-sm text-decoration-none h-100 transition-hover bg-white">
                <div class="card-body p-3 d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-info bg-opacity-10 text-info rounded p-2.5 d-inline-flex">
                            <i class="bi bi-list-columns-reverse fs-5"></i>
                        </div>
                        <div>
                            <span class="text-muted small d-block fw-semibold text-uppercase tracking-wider" style="font-size: 0.7rem;">Queues</span>
                            <h4 class="mb-0 fw-bold text-dark mt-0.5">{{ queues|length|default:"0" }}</h4>
                        </div>
                    </div>
                    <i class="bi bi-chevron-right text-muted small"></i>
                </div>
            </a>
        </div>
        <!-- Queue Groups -->
        <div class="col-6 col-lg">
            <a href="{% url 'queue_groups' %}" class="card border-0 shadow-sm text-decoration-none h-100 transition-hover bg-white">
                <div class="card-body p-3 d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-purple bg-opacity-10 text-purple rounded p-2.5 d-inline-flex" style="background-color: rgba(111,66,193,0.1); color: #6f42c1;">
                            <i class="bi bi-tags fs-5"></i>
                        </div>
                        <div>
                            <span class="text-muted small d-block fw-semibold text-uppercase tracking-wider" style="font-size: 0.7rem;">Queue Groups</span>
                            <h4 class="mb-0 fw-bold text-dark mt-0.5">{{ queue_groups|length|default:"0" }}</h4>
                        </div>
                    </div>
                    <i class="bi bi-chevron-right text-muted small"></i>
                </div>
            </a>
        </div>
        <!-- Total Jobs -->
        <div class="col-6 col-lg">
            <div class="card border-0 shadow-sm h-100 bg-white">
                <div class="card-body p-3 d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-warning bg-opacity-10 text-warning rounded p-2.5 d-inline-flex">
                            <i class="bi bi-journal-text fs-5"></i>
                        </div>
                        <div>
                            <span class="text-muted small d-block fw-semibold text-uppercase tracking-wider" style="font-size: 0.7rem;">Total Jobs</span>
                            <h4 class="mb-0 fw-bold text-dark mt-0.5">{{ total_jobs|default:"0" }}</h4>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
