<!DOCTYPE html>
<html>
<head>
    <title>Clusters</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <h1 class="mb-4">Available Clusters</h1>

    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Node Types</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for cluster in clusters %}
                <tr>
                    <td>{{ cluster.id }}</td>
                    <td>{{ cluster.name }}</td>
                    <td>{{ cluster.description }}</td>
                    <td>
                        {% for node in cluster.node_types %}
                            {{ node.name }}{% if not forloop.last %}, {% endif %}
                        {% empty %}
                            -
                        {% endfor %}
                    </td>
                    <td>
                        <a href="{% url 'cluster_detail' cluster.id %}" class="btn btn-sm btn-primary me-1">Detail</a>
                        <a href="{% url 'cluster_delete' cluster.id %}" class="btn btn-sm btn-danger">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
