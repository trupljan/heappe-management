{% extends "base.html" %}
{% load static %}

{% block content %}
<!DOCTYPE html>
<html>
<head>
    <title>Configuration Wizard</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .step { display: none; }
        .step.active { display: block; }
        .error { color: red; }
        .nested { margin-left: 1rem; }
        .array-item { border: 1px solid #e2e8f0; padding: 0.5rem; margin-bottom: 0.5rem; }
    </style>
</head>
<body class="bg-gray-100">
    <div id="app" class="container mx-auto p-4">
        <h1 class="text-2xl font-bold mb-4">Configuration Wizard</h1>
        <div class="bg-white p-6 rounded shadow">
            <div class="mb-4">
                <div class="flex justify-between">
                    <div v-for="(step, index) in steps" :key="index"
                         :class="['px-4 py-2', currentStep === index ? 'bg-blue-500 text-white' : 'bg-gray-200']">
                        {{ step.title }}
                    </div>
                </div>
            </div>

            <!-- Dynamic Steps -->
            <div v-for="(section, sectionName, index) in config"
                 :key="sectionName"
                 class="step"
                 :class="{ 'active': currentStep === index }">
                <h2 class="text-xl font-semibold mb-4">{{ sectionName }}</h2>
                <div v-for="(value, key) in section" :key="key" class="mb-4">
                    <div v-if="isObject(value) && !isArray(value)">
                        <h3 class="font-medium">{{ key }}</h3>
                        <div class="nested">
                            <div v-for="(subValue, subKey) in value" :key="subKey" class="mb-2">
                                <div v-if="isObject(subValue) && !isArray(subValue)">
                                    <h4 class="font-medium">{{ subKey }}</h4>
                                    <div class="nested">
                                        <div v-for="(subSubValue, subSubKey) in subValue" :key="subSubKey" class="mb-2">
                                            <div v-if="isSimpleValue(subSubValue)">
                                                <label class="block">{{ subSubKey }}<span v-if="isRequired(sectionName, key, subKey, subSubKey)">*</span></label>
                                                <input v-if="typeof subSubValue === 'string'"
                                                       v-model="config[sectionName][key][subKey][subSubKey]"
                                                       :required="isRequired(sectionName, key, subKey, subSubKey)"
                                                       class="w-full p-2 border rounded">
                                                <input v-else-if="typeof subSubValue === 'number'"
                                                       type="number"
                                                       v-model.number="config[sectionName][key][subKey][subSubKey]"
                                                       class="w-full p-2 border rounded">
                                                <input v-else-if="typeof subSubValue === 'boolean'"
                                                       type="checkbox"
                                                       v-model="config[sectionName][key][subKey][subSubKey]">
                                            </div>
                                            <div v-else-if="isArray(subSubValue)">
                                                <label class="block">{{ subSubKey }}</label>
                                                <textarea v-model="config[sectionName][key][subKey][subSubKey]"
                                                          class="w-full p-2 border rounded"
                                                          placeholder="Enter array items as JSON"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div v-else-if="isSimpleValue(subValue)">
                                    <label class="block">{{ subKey }}<span v-if="isRequired(sectionName, key, subKey)">*</span></label>
                                    <input v-if="typeof subValue === 'string'"
                                           v-model="config[sectionName][key][subKey]"
                                           :required="isRequired(sectionName, key, subKey)"
                                           class="w-full p-2 border rounded">
                                    <input v-else-if="typeof subValue === 'number'"
                                           type="number"
                                           v-model.number="config[sectionName][key][subKey]"
                                           class="w-full p-2 border rounded">
                                    <input v-else-if="typeof subValue === 'boolean'"
                                           type="checkbox"
                                           v-model="config[sectionName][key][subKey]">
                                </div>
                                <div v-else-if="isArray(subValue)">
                                    <label class="block">{{ subKey }}</label>
                                    <textarea v-model="config[sectionName][key][subKey]"
                                              class="w-full p-2 border rounded"
                                              placeholder="Enter array items as JSON"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div v-else-if="isSimpleValue(value)">
                        <label class="block">{{ key }}<span v-if="isRequired(sectionName, key)">*</span></label>
                        <input v-if="typeof value === 'string'"
                               v-model="config[sectionName][key]"
                               :required="isRequired(sectionName, key)"
                               class="w-full p-2 border rounded">
                        <input v-else-if="typeof value === 'number'"
                               type="number"
                               v-model.number="config[sectionName][key]"
                               class="w-full p-2 border rounded">
                        <input v-else-if="typeof value === 'boolean'"
                               type="checkbox"
                               v-model="config[sectionName][key]">
                    </div>
                    <div v-else-if="isArray(value)">
                        <label class="block">{{ key }}</label>
                        <textarea v-model="config[sectionName][key]"
                                  class="w-full p-2 border rounded"
                                  placeholder="Enter array items as JSON"></textarea>
                    </div>
                </div>
            </div>

            <!-- Review Step -->
            <div class="step" :class="{ 'active': currentStep === steps.length - 1 }">
                <h2 class="text-xl font-semibold mb-4">Review Configuration</h2>
                <pre class="bg-gray-100 p-4 rounded">{{ formattedConfig }}</pre>
            </div>

            <div class="flex justify-between mt-4">
                <button @click="prevStep" :disabled="currentStep === 0"
                        class="px-4 py-2 bg-gray-300 rounded">Previous</button>
                <button @click="nextStep" v-if="currentStep < steps.length - 1"
                        class="px-4 py-2 bg-blue-500 text-white rounded">Next</button>
                <button @click="submitConfig" v-if="currentStep === steps.length - 1"
                        class="px-4 py-2 bg-green-500 text-white rounded">Submit</button>
            </div>

            <div v-if="error" class="error mt-4">{{ error }}</div>
        </div>
    </div>

    <script>
        new Vue({
            el: '#app',
            data: {
                config: {{ config|safe }},
                currentStep: 0,
                requiredFields: [
                    'ConnectionStrings.MiddlewareContext',
                    'ConnectionStrings.Logging',
                    'ExternalAuthenticationSettings.BaseUrl',
                    'ExternalAuthenticationSettings.RealmName',
                    'ExternalAuthenticationSettings.ClientId',
                    'ExternalAuthenticationSettings.SecretId',
                    'ExternalAuthenticationSettings.Projects[0].UUID',
                    'ExternalAuthenticationSettings.Projects[0].Name',
                    'ExternalAuthenticationSettings.LexisAuthenticationConfiguration.BaseAddress'
                ],
                error: ''
            },
            computed: {
                steps() {
                    return [
                        ...Object.keys(this.config).map(key => ({ title: key })),
                        { title: 'Review' }
                    ];
                },
                formattedConfig() {
                    return JSON.stringify(this.config, null, 2);
                }
            },
            methods: {
                isObject(value) {
                    return value && typeof value === 'object' && !Array.isArray(value);
                },
                isArray(value) {
                    return Array.isArray(value);
                },
                isSimpleValue(value) {
                    return typeof value === 'string' || typeof value === 'number' || typeof value === 'boolean';
                },
                isRequired(section, key, subKey, subSubKey) {
                    let path = section;
                    if (key) path += `.${key}`;
                    if (subKey) path += `.${subKey}`;
                    if (subSubKey) path += `.${subSubKey}`;
                    return this.requiredFields.includes(path);
                },
                nextStep() {
                    if (this.validateStep()) {
                        this.currentStep++;
                    }
                },
                prevStep() {
                    this.currentStep--;
                    this.error = '';
                },
                validateStep() {
                    if (this.currentStep === this.steps.length - 1) return true; // Skip validation for review step
                    const sectionName = this.steps[this.currentStep].title;
                    const errors = [];
                    this.requiredFields.forEach(field => {
                        if (field.startsWith(sectionName)) {
                            let keys = field.split('.');
                            let current = this.config;
                            let path = [];
                            for (let key of keys) {
                                path.push(key);
                                if (key.includes('[')) {
                                    let [arrayKey, index] = key.split('[');
                                    index = parseInt(index.replace(']', ''));
                                    current = current[arrayKey][index];
                                } else {
                                    current = current[key];
                                }
                            }
                            if (typeof current === 'string' && !current) {
                                errors.push(`Field ${field} is required`);
                            }
                        }
                    });
                    if (errors.length) {
                        this.error = errors.join(', ');
                        return false;
                    }
                    this.error = '';
                    return true;
                },
                submitConfig() {
                    if (this.validateStep()) {
                        $.ajax({
                            url: '/config',
                            type: 'POST',
                            contentType: 'application/json',
                            data: JSON.stringify(this.config),
                            success: (response) => {
                                alert('Configuration saved successfully!');
                            },
                            error: (xhr) => {
                                this.error = xhr.responseJSON.error || 'An error occurred';
                            }
                        });
                    }
                }
            }
        });
    </script>
</body>
</html>
{% endblock %}
