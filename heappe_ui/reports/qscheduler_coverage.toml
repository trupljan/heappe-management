[[sections.features]]
name = "Presence detection"
code = ["core:presence", "deploy:qscheduler_live_api"]
verified = "Missing / present (with the container state) from Docker; Docker unavailable → unreachable; SSH into container: login works → present, otherwise unreachable; live status of an archived instance reports presence only; an existing container that does not answer is marked restartable (*Try restart* button), a missing or healthy one is not."
not_tested = "SSH to VM presence."

[[sections.features]]
name = "Archive / unarchive"
code = ["recovery:archive_instance", "recovery:unarchive_instance", "recovery:_ensure_not_running",
        "recovery:qscheduler_archive_api", "recovery:qscheduler_unarchive_api"]
verified = "A running instance is refused; a missing one is archived (also through the API, unarchive only when the service answers) with the detected reason, assignments kept; unarchive only when the service answers again. Archived instances: restart, undeploy, assign and unassign refused; no machine can be added; removing a cluster deletes only the HEAppE cluster without contacting QScheduler."
not_tested = "–"

