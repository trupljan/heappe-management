[[sections.features]]
name = "Add machine"
code = ["machines:add_machine_worker", "machines:_create_cluster", "machines:_register_cluster_resources",
        "machines:_assignment_for"]
verified = "New machine: refused when it already exists (points to *Use existing machine*), otherwise `machine add` + `notifier add`, one restart, cluster with the notifier and its token in Vault. Existing (shared) machine: only `notifier add`, cluster with `MasterNodeName` = QScheduler host and `EnableCallback=true`, no project when not requested. Without notifications: no command, no restart, `EnableCallback=false`."
not_tested = "CLI failure, REST verification of the machine, project/allocation/credential creation, machine missing from the instance list."

[[sections.features]]
