[[sections]]
title = "HEAppE assignments and notifications"
note = "Each cluster has its own notifier `<HEAppE identifier>.<machine>` with its own token, stored in HEAppE Vault."

[[sections.features]]
name = "Assignment form validation"
code = ["deploy:parse_assignment_options"]
verified = "Valid input; missing HEAppE instance and non-HTTP callback URL rejected."
not_tested = "–"

[[sections.features]]
name = "Assign / edit assignment"
code = ["deploy:assign_worker", "deploy:qscheduler_assign_api", "deploy:qscheduler_heappe_info_api"]
verified = "No clusters yet: identifier, network and auto-detected callback URL saved, no notifier, no restart, container joins the HEAppE network. Enabling notifications: one notifier per cluster with its own token, one restart for all, clusters updated. Disabling: this HEAppE's notifiers removed, other HEAppEs' untouched. Unchanged settings: no command, no restart. Duplicate HEAppE identifier on one QScheduler refused."
not_tested = "Token rotation (*Generate new tokens*), callback URL change, remote instance without callback URL, `qscheduler_heappe_info_api`."

[[sections.features]]
name = "Cluster notification settings"
code = ["core:notification_config", "core:build_cluster_custom_configuration", "core:update_cluster_notifications",
        "core:cluster_notifier", "core:cluster_notifier_name", "core:new_notify_token", "core:replace_notifiers"]
verified = "Own notifier: `EnableCallback`, `QSchedulerNotifier`, `QSchedulerNotifyToken` with the Vault toggle; updating existing clusters keeps other settings, masked values and unrelated vault toggles."
not_tested = "–"

[[sections.features]]
name = "Matching clusters to an instance"
code = ["core:qscheduler_clusters", "core:cluster_machine", "core:id_of", "core:as_dict"]
verified = "By `QSchedulerHost`/`MasterNodeName` + port; other schedulers and ports ignored; machine taken from the queue."
not_tested = "–"

[[sections.features]]
name = "Unassign"
code = ["deploy:unassign_worker", "deploy:qscheduler_unassign_api"]
verified = "Refused while the HEAppE has clusters on the instance (assignment kept); otherwise leftover notifiers removed and assignment deleted."
not_tested = "*Force* when the HEAppE API is unreachable, network disconnect, the unassign API."

