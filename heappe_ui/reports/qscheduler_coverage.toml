# Input of `python manage.py qscheduler_coverage`, which generates QScheduler_COVERAGE.md.
#
# Measured numbers and feature statuses are computed; everything else (feature descriptions, next tests) is written
# here by hand. After changing QScheduler code or tests:
#   1. map new functions to a feature below (the report lists unmapped code),
#   2. update "verified" / "not_tested" of the features you touched,
#   3. run `python manage.py qscheduler_coverage` and commit the report.
#
# Feature fields:
#   name        feature name
#   code        functions / classes / methods measured for the feature, as "<file key>:<name>", e.g.
#               "deploy:deploy_worker", "core:DockerTarget" (all methods) or "core:DockerTarget.restart"
#   status      only for features without measurable Python code (templates, code outside the measured files):
#               "covered", "partial" or "none"; explain it in status_reason
#   verified    what the tests verify
#   not_tested  what they don't

title = "QScheduler test coverage report"
output = "QScheduler_COVERAGE.md"
intro = """Coverage of the QScheduler features (QScheduler page, HEAppE assignments, quantum machines on the Clusters page,
QScheduler cluster settings) by the automated tests in `heappe_ui/tests.py`."""
scope_note = """All tests run without Docker, SSH, git, GitHub/GitLab, a QScheduler or a HEAppE server: those are replaced by mocks.
The tests therefore cover **decision logic** (validation, what is sent to QScheduler and HEAppE, blocking rules,
version gating). They do not cover the **I/O layer** (running docker commands, SSH sessions, health polling,
background threads). That layer accounts for most of the uncovered code."""

[files]
core = "heappe_ui/view/qscheduler_core.py"
deploy = "heappe_ui/view/qscheduler_deploy.py"
machines = "heappe_ui/view/qscheduler_machines.py"
recovery = "heappe_ui/view/qscheduler_recovery.py"
health = "heappe_ui/view/qscheduler_cluster_health.py"
admin = "heappe_ui/view/qscheduler_admin.py"
shareddb = "heappe_ui/view/qscheduler_shared_db.py"

[file_descriptions]
core = "Docker/SSH runners, targets, HEAppE and git helpers"
deploy = "QScheduler page, instances, assignments"
machines = "Clusters page: add/remove machine"
recovery = "missing instances: archive, cascade deletion, restore"
health = "cluster detail: QScheduler panel"
admin = "admin API proxy, client and admin token"
shareddb = "shared PostgreSQL, instance schemas, backups"

[tests]
module = "heappe_ui.tests"
path = "heappe_ui/tests.py"
class_pattern = '^class (QScheduler\w*)\('

[thresholds]
# Feature status from the line coverage of its code: >= covered -> covered, >= partial -> partly covered.
covered = 80
partial = 1
# "Least covered functions": functions with at least this many statements, this many rows.
least_covered_min_statements = 10
least_covered_rows = 10
gap_rows = 6

[unmapped]
# Small helpers that need no feature of their own.
ignore = ["deploy:_json_body", "deploy:_error", "deploy:_started", "deploy:_post_only", "deploy:_instance_or_404",
          "machines:_json_body", "machines:_error"]

